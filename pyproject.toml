[project]
name = "omunch"
version = "1.1.0"
description = "Omunch — a math arcade for elementary grades 2–5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pygame>=2.5.2"]

[project.scripts]
omunch = "omunch.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omunch*"]

[tool.setuptools.package-data]
omunch = ["assets/sounds/*.wav"]