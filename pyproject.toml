[project]
name = "omunchy"
version = "1.2.0"
description = "Omunchy — a math arcade for elementary grades 2–5"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Damon Hargraves" }]
dependencies = ["pygame>=2.5.2"]

[project.scripts]
omunchy = "omunchy.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omunchy*"]

[tool.setuptools.package-data]
omunchy = ["assets/sounds/*.wav"]
